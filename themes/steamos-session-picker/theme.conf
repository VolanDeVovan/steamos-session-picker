# Values reachable from Main.qml as config.<key>. SDDM reads this file, and then
# theme.conf.user beside it if it exists, so a machine can override any of them
# without the checkout going dirty.

[General]
# Who to log in as. Empty means "work it out": the last user SDDM recorded,
# otherwise the only account it lists. Set it where a machine has several people
# on it and the picker should always land on one of them.
user=

# Sessions never to offer, by desktop entry file name, separated by commas.
# Empty offers everything the machine has.
#
# A stock SteamOS has two KDE entries, and only one of them is the machine's own
# answer: `steamosctl get-default-desktop-session` says plasma.desktop, and
# plasmax11.desktop is the fallback for hardware a Steam Machine is not. Two
# cards that look alike and differ by a display server is not a choice a room
# can make. Put `hide=` in theme.conf.user beside this file to get it back.
hide=plasmax11.desktop
