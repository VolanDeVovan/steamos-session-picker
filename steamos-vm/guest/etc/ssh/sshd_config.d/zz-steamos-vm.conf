# Planted by steamos-vm. Key only, and the key is one the tool generated for
# itself — the developer's own identity is never copied in.
#
# The authorized keys file is an absolute path, deliberately: SteamOS resizes
# and repopulates /home on first boot, so a key left in the account's own
# directory does not survive it.
PasswordAuthentication no
PermitRootLogin prohibit-password
AuthorizedKeysFile /etc/ssh/steamos-vm_authorized_keys .ssh/authorized_keys
