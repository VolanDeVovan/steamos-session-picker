# Defaults for the SteamOS virtual machine.
#
# Every setting below can be overridden three ways, in increasing priority:
#
#   this file  →  steamos-vm.local.conf (git-ignored, yours)  →  the environment
#
# so a one-off is a prefix — `VM_RAM=16G ./steamos-vm start` — and a permanent
# change for your machine goes in the local file, which is never committed.

# Where to download Valve's recovery image from. Valve publishes them at
# https://help.steampowered.com/en/faqs/view/1B71-EDF2-EB6D-2BB3
#
# Deliberately empty: `fetch` asks for it rather than pinning a build, because a
# different image may need a different set of workarounds. The build this was
# developed against is steamdeck-oobe-repair-20260707.10 (SteamOS 3.8.14).
: "${VM_RECOVERY_URL:=}"

# The machine.
: "${VM_DISK_SIZE:=64G}"
: "${VM_RAM:=8G}"
: "${VM_CPUS:=4}"

# Host port forwarded to the guest's sshd, and the VNC display number its screen
# is served on — :1 is port 5901, and only on 127.0.0.1. Raise both if you run
# more than one of these at a time.
: "${VM_SSH_PORT:=2222}"
: "${VM_VNC:=:1}"

# The account SteamOS creates. Changing this alone is not enough: the sudoers
# file in guest/etc/sudoers.d names the user literally, because sudoers has no
# variable substitution. The two have to agree.
: "${VM_USER:=deck}"

# Everything generated — disk images, firmware variables, the ssh key, logs —
# lives here. Point it at another filesystem if you would rather not keep ~30 GB
# on this one. Nothing outside this directory is ever written.
: "${VM_STATE_DIR:=$SELF_DIR/var}"

# The UEFI firmware. Left empty, the usual distribution paths are searched; set
# both if it lives somewhere else. Must be the plain build, not the xen one,
# which never hands off to the image's own bootloader.
: "${VM_OVMF_CODE:=}"
: "${VM_OVMF_VARS:=}"

# Set these only if the tool is not on PATH under its own name. VM_VIEWER is
# whatever `view` should open the screen with; left empty, the usual VNC clients
# are tried in turn.
: "${VM_BTRFS:=}"
: "${VM_QEMU_NBD:=}"
: "${VM_VIEWER:=}"

# The network block device used to reach the disk image while the VM is off.
: "${VM_NBD:=/dev/nbd0}"

# Seconds between the keys `key` sends. Whatever is on screen is usually
# animating, and a burst faster than the animation is a burst the thing under
# test never sees as separate presses.
: "${VM_KEY_DELAY:=0.4}"
